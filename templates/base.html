<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>{% block title %}PSP Pay{% endblock %}</title>
  <!--
    HTMX (https://htmx.org) — drives all dynamic UI without writing JavaScript.
    Key attributes used in this app:
      hx-get / hx-post      HTTP method + URL to call on the server
      hx-target             CSS selector of element to update with the response
      hx-swap               How to update: "innerHTML" (replace contents),
                            "outerHTML" (replace the element itself)
      hx-indicator          Element that receives .htmx-request CSS class while
                            the request is in-flight (used to show the spinner)

    Flow for the Scan & Pay screen:
      1. User submits the scan form  →  hx-get="/ui/review" fires
      2. Server fetches payment details from the PISP, renders review.html partial
      3. HTMX swaps the partial into #result-area (innerHTML)
      4. User taps Approve/Decline  →  hx-post="/ui/consent/{id}" fires
      5. Server posts consent to PISP, renders confirm.html partial
      6. HTMX swaps the partial into #decision-area (outerHTML, replacing buttons)

    Note: HTMX executes <script> tags found inside swapped HTML, so partials
    can include initialisation logic that runs after they are injected.

    QR code scanning:
      Currently handled via copy-paste of the psp://pay?... URI from the terminal.
      Camera-based QR scanning will be added when the native iPhone demo app is built.
  -->
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <script>
    function copyText(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0;';
      document.body.appendChild(ta);
      ta.focus(); ta.select();
      try { document.execCommand('copy'); } finally { document.body.removeChild(ta); }
      return Promise.resolve();
    }
  </script>
  <style>
    /* -----------------------------------------------------------------------
       Design system — phone-first, minimal, clean
    ----------------------------------------------------------------------- */
    :root {
      --brand:       #1a56db;
      --brand-dark:  #1040a8;
      --success:     #057a55;
      --danger:      #c81e1e;
      --warn:        #d97706;
      --bg:          #f3f4f6;
      --surface:     #ffffff;
      --border:      #e5e7eb;
      --text:        #111827;
      --muted:       #6b7280;
      --radius:      14px;
      --shadow:      0 2px 12px rgba(0,0,0,.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Phone shell — max 430px, centred on desktop */
    .phone {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: var(--bg);
      display: flex;
      flex-direction: column;
    }

    /* Status bar simulation */
    .status-bar {
      background: var(--brand);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .3px;
    }
    .status-bar .app-name { font-size: 13px; }

    /* Content area */
    .content {
      flex: 1;
      padding: 20px 16px 32px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* Card */
    .card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px 20px;
    }

    /* Typography */
    h1 { font-size: 22px; font-weight: 700; line-height: 1.2; }
    h2 { font-size: 17px; font-weight: 600; }
    .subtitle { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .amount { font-size: 42px; font-weight: 800; color: var(--brand); line-height: 1; }
    .label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }

    /* Row items (label : value) */
    .detail-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 15px;
    }
    .detail-row:last-child { border-bottom: none; }
    .detail-row .value { font-weight: 600; text-align: right; }

    /* Buttons */
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(0.98); opacity: .9; }
    .btn-primary   { background: var(--brand);   color: #fff; }
    .btn-success   { background: var(--success);  color: #fff; }
    .btn-danger    { background: var(--danger);   color: #fff; }
    .btn-outline   { background: transparent; color: var(--brand); border: 2px solid var(--brand); }
    .btn-ghost     { background: var(--border); color: var(--text); }

    /* Input */
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .input-group input, .input-group select {
      padding: 14px 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      color: var(--text);
      background: var(--surface);
      width: 100%;
      outline: none;
      transition: border-color .15s;
    }
    .input-group input:focus, .input-group select:focus {
      border-color: var(--brand);
    }

    /* Status badge */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .3px;
    }
    .badge-success { background: #d1fae5; color: var(--success); }
    .badge-danger  { background: #fee2e2; color: var(--danger);  }
    .badge-warn    { background: #fef3c7; color: var(--warn);    }
    .badge-neutral { background: var(--border); color: var(--muted); }
    .badge-blue    { background: #dbeafe; color: var(--brand);   }

    /* Big status icon */
    .status-icon { font-size: 72px; text-align: center; padding: 12px 0; }

    /* Nav bar (bottom tabs) */
    .nav-bar {
      display: flex;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 8px 0 env(safe-area-inset-bottom, 8px);
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 6px 0;
      text-decoration: none;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      transition: color .15s;
    }
    .nav-item.active { color: var(--brand); }
    .nav-icon { font-size: 22px; line-height: 1; }

    /* Alert / error banner */
    .alert {
      padding: 14px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
    }
    .alert-error { background: #fee2e2; color: var(--danger); }
    .alert-info  { background: #dbeafe; color: #1e40af; }

    /* Loading spinner inside buttons */
    .htmx-request .spinner { display: inline-block; }
    .spinner { display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 1s linear infinite; display: inline-block; }

    /* Divider */
    .divider { height: 1px; background: var(--border); }

    /* History list */
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    .history-item:last-child { border-bottom: none; }
    .history-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }

    /* Mono ID */
    .mono {
      font-family: "SF Mono", "Menlo", monospace;
      font-size: 12px;
      color: var(--muted);
      word-break: break-all;
    }

    /* Utilities */
    .text-center { text-align: center; }
    .mt-4 { margin-top: 16px; }
    .gap-8 { gap: 8px; }
    .flex-col { display: flex; flex-direction: column; }
    .flex-row { display: flex; flex-direction: row; }
  </style>
</head>
<body>
<div class="phone">

  <!-- Status bar -->
  <div class="status-bar">
    <span class="app-name">💳 PSP Pay</span>
    <span>{{ payer_name }}</span>
  </div>

  <!-- Main content -->
  <div class="content">
    {% block content %}{% endblock %}
  </div>

  <!-- Bottom nav -->
  <nav class="nav-bar">
    <a href="/ui/" class="nav-item {% block nav_pay %}{% endblock %}">
      <span class="nav-icon">📷</span>Pay
    </a>
    <a href="/ui/request-payment" class="nav-item {% block nav_request %}{% endblock %}">
      <span class="nav-icon">💸</span>Request
    </a>
    {% if mandates_supported %}
    <a href="/ui/iou" class="nav-item {% block nav_iou %}{% endblock %}">
      <span class="nav-icon">🧾</span>IOU
    </a>
    {% endif %}
    <a href="/ui/history" class="nav-item {% block nav_history %}{% endblock %}">
      <span class="nav-icon">🕒</span>History
    </a>
    <a href="/ui/disputes" class="nav-item {% block nav_disputes %}{% endblock %}">
      <span class="nav-icon">⚖️</span>Disputes
    </a>
  </nav>

</div>
</body>
</html>
